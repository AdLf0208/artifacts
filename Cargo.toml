[package]
# Port of Artifacts 15.1.3 (ochotonida/artifacts, MIT), branch 26.1
# (behaviour identical on the 1.21.1 branch, 13.2.5, for these three items). Minecraft
# Java NeoForge; the port targets Horizon 26.3 at the pin in horizon-mod.toml.
# Clean-room Rust rewrite from the mod's behaviour; local-only until publishing is
# approved, publishable under MIT with this source.
#
# Cargo's name and version are not the mod's identity: horizon-mod.toml is.
name = "artifacts"
version = "0.2.0"
edition = "2024"
license = "MIT"
description = "Artifacts for Horizon: carried artifacts grant their upstream attribute and damage effects"
publish = false

[dependencies]
# The pinned SDK's API crate, fetched into .horizon/sdk/ by any `cargo horizon-mod` command
# (the launcher builds against its own copy of the same build). This port adds no registry
# dependency of its own, so the package carries no Cargo.lock: a packed lock resolves newer
# crates than the SDK's own and changes the artifact.
horizon-mod-api = { path = ".horizon/sdk/api/crates/horizon-mod-api" }
